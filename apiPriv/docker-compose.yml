services:
  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: api
    restart: always
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    networks:
      - app-network
      - global-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  global-network:
    external: true
